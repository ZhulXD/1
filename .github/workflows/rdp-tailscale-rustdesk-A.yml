name: RDP + Tailscale + RustDesk + 9Router + DeepSeek Harness (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (e.g. you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (device admin, no Bearer)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (reusable or ephemeral)", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes (max 360 = 6h hard limit; default 360)", required: false, default: "360" }
      do_purge:           { description: "Purge bullet* devices at start (single instance only)", required: false, default: "true" }
      cycles:             { description: "0=stop after A; N=handoffs left incl this run", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10) [ignored if CRD provided]", required: false, default: "1" }
      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}   # expose single vs multi
    steps:
      - id: mk
        run: |
          # Safe literal read (so full commands with &, quotes, ${Env:...} don't break)
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          # If CRD provided -> force single; else use rdp_count (1..10)
          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }

          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          # NEW: multi flag
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 360  # GitHub-hosted runners are hard-killed at 6h
    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:
      # --- CRD FIRST (prevent code timeout) ---
      - name: Set CRD flag early (safe read)
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV } else { "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV }
          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"
          # Record job start so Keep-alive can stop just before GitHub's 6h hard kill
          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -Append $env:GITHUB_ENV

      - name: Install Chrome Remote Desktop Host (if missing)  # EXE -> MSI fallback
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "CRD host not found, attempting install (EXE -> MSI fallback)..."
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
              $ok = $true
            } catch {
              Write-Host "EXE installer failed or missing: $($_.Exception.Message)"
            }
            if (-not $ok) {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              try {
                Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
                Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
                Remove-Item $msi -Force
              } catch {
                Write-Error "CRD MSI fallback failed: $($_.Exception.Message)"
                exit 1
              }
            }
          } else {
            Write-Host "CRD host already installed."
          }

      - name: Run Chrome Remote Desktop (accept raw code / full cmd / url) with PIN
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          if ($pin -notmatch '^\d{6,12}$') { Write-Error "crd_pin must be 6–12 digits."; exit 1 }

          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { Write-Error "remoting_start_host.exe not found."; exit 1 }

          $isFull = $false; $code = $null
          if ($raw -match 'remoting_start_host\.exe') { $isFull = $true }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }

          if ($code) {
            $redir = "https://remotedesktop.google.com/_/oauthredirect"
            $name  = $Env:COMPUTERNAME
            $args  = @("--code=""$code""","--redirect-url=""$redir""","--name=""$name""","--pin=""$pin""")
            Start-Process -FilePath $starter -ArgumentList $args
          } elseif ($isFull) {
            # Last resort: run as-is (might prompt if it lacks --pin)
            $tmp = "$env:TEMP\crd_full.ps1"
            Set-Content -Path $tmp -Value $raw -Encoding UTF8
            powershell -ExecutionPolicy Bypass -File $tmp
          } else {
            Write-Error "Could not detect CRD code. Provide raw code (4/...), full command, or string containing --code=\"4/...\""
            exit 1
          }
          Write-Host "CRD launch step completed with PIN."

      - name: Verify CRD registration (service + recent logs)
        if: env.CRD_ENABLED == '1'
        run: |
          $svcName = "Chrome Remote Desktop Service"
          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service -Name $svcName -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -in 'Running','StartPending') { $ok = $true; break }
            Start-Sleep -Seconds 3
          }
          if ($ok) { Write-Host "[$svcName] status: Running or starting." } else { Write-Warning "[$svcName] not running yet." }

          $logDir = "$env:ProgramData\Google\Chrome Remote Desktop"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter "host*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
              Write-Host "----- LOG: $($_.FullName) -----"
              Get-Content $_.FullName -Tail 200
            }
          } else { Write-Host "CRD log directory not found: $logDir" }

      # --- Continue with the rest after CRD is launched ---
      - name: Decide hostname + runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) { $hn = "bullet${{ matrix.id }}" } else { $hn = "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV

          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          function IntOr($v,$d){ if("$v" -match '^\d+$'){ [int]$v } else { [int]$d } }
          $runtime = IntOr("${{ inputs.runtime_minutes }}",360)
          if (Yes("${{ inputs.quick_test }}")) { $runtime = 5 }
          if (-not (Yes("${{ inputs.quick_test }}")) -and $runtime -lt 6) { $runtime = 360 }
          if ($runtime -gt 360) { $runtime = 360 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Hostname: $hn  | Runtime: $runtime"

      # ---------- PURGE only for SINGLE INSTANCE ----------
      - name: Purge bullet* devices (single-instance only)
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          if (Yes("${{ inputs.do_purge }}")) {
            try {
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${{ inputs.ts_api_key }}:"))
              $tn = [uri]::EscapeDataString("${{ inputs.ts_tailnet }}")
              $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" -Headers @{ Authorization = "Basic $auth" }
              foreach($d in $list.devices){
                if ($d.hostname -match '^bullet[0-9]*$'){
                  Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers @{ Authorization = "Basic $auth" } -ErrorAction SilentlyContinue
                }
              }
              Write-Host "Purged bullet* devices (if any)."
            } catch { Write-Host "Purge warning: $($_.Exception.Message)" }
          } else {
            Write-Host "Purge disabled."
          }

      - name: Install + Up Tailscale
        timeout-minutes: 10   # hard kill-switch: never hang 6h again
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # External commands can block FOREVER on a stalled download, a wedged
          # msiexec, or tailscaled not responding. This guard kills them after
          # a fixed deadline so the step fails fast with a clear message.
          function Invoke-Guarded([string]$File, [string[]]$CmdArgs, [int]$TimeoutSec, [string]$What, [switch]$NoFail) {
            $out = "$env:TEMP\guard-out.txt"; $err = "$env:TEMP\guard-err.txt"
            Remove-Item $out, $err -Force -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $File -ArgumentList $CmdArgs -NoNewWindow -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit($TimeoutSec * 1000)) {
              try { $p.Kill() } catch {}
              $log = (Get-Content $out, $err -Raw -ErrorAction SilentlyContinue) -join "`n"
              if ($NoFail) { Write-Host "WARN: $What timed out after ${TimeoutSec}s (killed). $log"; return $null }
              throw "$What TIMED OUT after ${TimeoutSec}s (process killed). Output: $log"
            }
            $stdout = Get-Content $out -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content $err -Raw -ErrorAction SilentlyContinue
            if ($stdout) { Write-Host $stdout.Trim() }
            if ($p.ExitCode -ne 0) {
              if ($NoFail) { Write-Host "WARN: $What exited $($p.ExitCode): $stderr"; return $null }
              throw "$What failed (exit $($p.ExitCode)): $stderr"
            }
            return $stdout
          }

          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Write-Host "Downloading $url ..."
            # curl.exe has real connect/total timeouts + retries; plain Invoke-WebRequest has NO default timeout and can stall forever
            curl.exe -fSL -sS --connect-timeout 30 --max-time 600 --retry 3 --retry-delay 5 -o $dst $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dst)) { throw "Tailscale MSI download failed (curl exit $LASTEXITCODE)." }
            $size = (Get-Item $dst).Length
            if ($size -lt 20MB) { Remove-Item $dst -Force -ErrorAction SilentlyContinue; throw "Downloaded MSI looks truncated ($size bytes)." }
            Write-Host ("Downloaded {0:N1} MB." -f ($size/1MB))

            Write-Host "Installing MSI (max 240s)..."
            $msi = Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -PassThru
            if (-not $msi.WaitForExit(240000)) {
              try { $msi.Kill() } catch {}
              Remove-Item $dst -Force -ErrorAction SilentlyContinue
              throw "msiexec hung >240s (killed). Failing fast instead of hanging the job."
            }
            Remove-Item $dst -Force -ErrorAction SilentlyContinue
            if ($msi.ExitCode -notin 0, 3010) { throw "msiexec failed with exit code $($msi.ExitCode)." }
            Write-Host "MSI install finished (exit $($msi.ExitCode))."
            if (-not (Test-Path $ts)) { throw "tailscale.exe not found at $ts after install." }
          } else {
            Write-Host "Tailscale already installed."
          }

          # Fresh MSI install: the Tailscale service can take a while to appear/start
          $svcDeadline = (Get-Date).AddSeconds(90)
          do {
            $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $svcDeadline)
          $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Tailscale service missing after install." }
          if ($svc.Status -ne 'Running') {
            Write-Host "Tailscale service is $($svc.Status); starting it..."
            Start-Service Tailscale
            Start-Sleep -Seconds 10
          }
          Write-Host "Tailscale service status: $((Get-Service -Name Tailscale).Status)"

          Invoke-Guarded $ts @('logout') 60 'tailscale logout' -NoFail | Out-Null

          # --timeout bounds tailscale's own wait; Invoke-Guarded is the hard kill-switch
          Invoke-Guarded $ts @('up','--authkey',"${{ inputs.ts_authkey }}",'--hostname',"$env:TS_HOSTNAME",'--accept-dns=true','--accept-routes=true','--timeout=120s') 150 'tailscale up' | Out-Null

          $ipOut = Invoke-Guarded $ts @('ip','-4') 30 'tailscale ip -4'
          $ip4 = ($ipOut -split "\r?\n" | Select-Object -First 1).Trim()
          if (-not $ip4) { throw "tailscale ip -4 returned nothing." }
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $ip4"

      - name: Enable RDP user + firewall
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
            Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Write-Host "RDP ready. user=$u pass=$p host=$env:TS_HOSTNAME ip=$env:TAILSCALE_IP"

      - name: Install Python libs (pyautogui/pynput/pillow/DrissionPage/pyotp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall pyautogui pynput pillow DrissionPage pyotp
          python -c "import pyautogui, pynput, PIL, pyotp; print('Python libs OK (incl. TOTP)')"

      # ============================================================
      #  9ROUTER + DEEPSEEK HARNESS + ANTIGRAVITY AUTO-LOGIN
      # ============================================================

      - name: Install Node.js (LTS 22.x)
        run: |
          $nodeExe = "$env:ProgramFiles\nodejs\node.exe"
          if (-not (Test-Path $nodeExe)) {
            Write-Host "Installing Node.js 22 LTS..."
            $url = "https://nodejs.org/dist/v22.23.2/node-v22.23.2-x64.msi"
            $dst = "$env:TEMP\nodejs.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
            # Add to PATH for this session
            $env:PATH = "$env:ProgramFiles\nodejs;$env:PATH"
          }
          node -v
          npm -v

      - name: Install 9Router globally
        run: |
          npm install -g 9router
          Write-Host "9Router installed successfully."

      - name: Start 9Router (background)
        run: |
          # Start 9Router in background, disable login requirement for automation
          $env:INITIAL_PASSWORD = ""
          $job = Start-Job -ScriptBlock {
            $env:PORT = "20128"
            $env:NEXT_PUBLIC_BASE_URL = "http://localhost:20128"
            npx 9router --no-open 2>&1
          }
          # Wait for 9Router to be ready
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:20128" -UseBasicParsing -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if ($ready) {
            Write-Host "9Router is running at http://localhost:20128"
          } else {
            Write-Warning "9Router may not be fully ready yet, continuing..."
          }
          "NINEROUTER_RUNNING=1" | Out-File -Append $env:GITHUB_ENV

      - name: Auto-login Antigravity account to 9Router (with 2FA TOTP)
        env:
          AG_EMAIL: ${{ secrets.ANTIGRAVITY_EMAIL }}
          AG_PASSWORD: ${{ secrets.ANTIGRAVITY_PASSWORD }}
          AG_TOTP_SECRET: ${{ secrets.ANTIGRAVITY_TOTP_SECRET }}
        run: |
          # Clone the auto-login bot
          git clone https://github.com/mrn0sleep/9router-auto-login-antigravity.git "$env:TEMP\antigravity-bot"

          # Create accounts file with the Antigravity credentials from secrets
          $accountsContent = "$($env:AG_EMAIL):$($env:AG_PASSWORD)"
          Set-Content -Path "$env:TEMP\antigravity-bot\accounts.txt" -Value $accountsContent -Encoding UTF8

          # Create a TOTP helper script that auto-fills 2FA codes
          # Credentials are injected via environment variables (from GitHub Secrets)
          $totpScript = @"
          import pyotp
          import time
          import sys
          import os
          from DrissionPage import ChromiumPage, ChromiumOptions

          TOTP_SECRET = os.environ["AG_TOTP_SECRET"]
          EMAIL = os.environ["AG_EMAIL"]
          PASSWORD = os.environ["AG_PASSWORD"]
          ROUTER_URL = "http://localhost:20128"

          def get_totp_code():
              totp = pyotp.TOTP(TOTP_SECRET)
              return totp.now()

          def main():
              print(f"[TOTP] Starting Antigravity auto-login with 2FA support...")
              print(f"[TOTP] Current TOTP code: {get_totp_code()}")

              # Setup headless Chrome
              opts = ChromiumOptions()
              opts.headless(True)
              opts.set_argument('--no-sandbox')
              opts.set_argument('--disable-dev-shm-usage')
              opts.set_argument('--disable-gpu')

              page = ChromiumPage(opts)

              try:
                  # Step 1: Navigate to 9Router and click Antigravity provider
                  print("[1/6] Opening 9Router dashboard...")
                  page.get(f"{ROUTER_URL}/dashboard/providers")
                  time.sleep(3)

                  # Click Antigravity add button
                  print("[2/6] Clicking Antigravity provider...")
                  ag_btn = page.ele('text:Antigravity') or page.ele('text:antigravity')
                  if ag_btn:
                      ag_btn.click()
                      time.sleep(2)

                  # Click Add / Add Connection
                  add_btn = page.ele('text:Add') or page.ele('text:Add Connection')
                  if add_btn:
                      add_btn.click()
                      time.sleep(2)

                  # Click I Understand / Continue
                  confirm_btn = page.ele('text:I Understand') or page.ele('text:Continue')
                  if confirm_btn:
                      confirm_btn.click()
                      time.sleep(5)

                  # Step 2: Handle Google login (may open new tab)
                  print("[3/6] Handling Google OAuth login...")
                  tabs = page.tab_ids
                  if len(tabs) > 1:
                      page.to_tab(tabs[-1])
                      time.sleep(2)

                  # Enter email
                  print("[4/6] Entering email...")
                  email_input = page.ele('tag:input@type=email') or page.ele('#identifierId')
                  if email_input:
                      email_input.input(EMAIL)
                      time.sleep(1)
                      next_btn = page.ele('#identifierNext') or page.ele('text:Next')
                      if next_btn:
                          next_btn.click()
                          time.sleep(3)

                  # Enter password
                  print("[5/6] Entering password...")
                  pwd_input = page.ele('tag:input@type=password') or page.ele('tag:input@name=Passwd')
                  if pwd_input:
                      pwd_input.input(PASSWORD)
                      time.sleep(1)
                      pwd_next = page.ele('#passwordNext') or page.ele('text:Next')
                      if pwd_next:
                          pwd_next.click()
                          time.sleep(5)

                  # Step 3: Handle 2FA TOTP verification
                  print("[6/6] Checking for 2FA prompt...")
                  time.sleep(3)
                  page_text = page.html.lower()

                  # Check if 2FA is requested
                  if any(kw in page_text for kw in ['verification', 'verify', '2-step', 'authenticator', 'enter code', 'kode verifikasi']):
                      print("[TOTP] 2FA prompt detected! Generating TOTP code...")
                      code = get_totp_code()
                      print(f"[TOTP] Using code: {code}")

                      # Try different possible input selectors for TOTP code
                      totp_input = (
                          page.ele('tag:input@id=totpPin') or
                          page.ele('tag:input@name=totpPin') or
                          page.ele('tag:input@type=tel') or
                          page.ele('tag:input@aria-label*=code') or
                          page.ele('tag:input@aria-label*=Enter') or
                          page.ele('tag:input@autocomplete=one-time-code')
                      )
                      if totp_input:
                          totp_input.input(code)
                          time.sleep(1)
                          # Click Next/Verify
                          verify_btn = page.ele('text:Next') or page.ele('text:Verify') or page.ele('#totpNext')
                          if verify_btn:
                              verify_btn.click()
                              time.sleep(5)
                          print("[TOTP] 2FA code submitted successfully!")
                      else:
                          print("[TOTP] WARNING: Could not find TOTP input field")
                          # Try with pyautogui as fallback
                          import pyautogui
                          pyautogui.typewrite(code, interval=0.05)
                          pyautogui.press('enter')
                          time.sleep(5)
                  else:
                      print("[TOTP] No 2FA prompt detected, login may have succeeded directly.")

                  # Switch back to main tab if needed
                  tabs = page.tab_ids
                  if len(tabs) > 1:
                      page.to_tab(tabs[0])

                  time.sleep(3)
                  print("[OK] Antigravity auto-login with 2FA completed!")
                  print(f"[OK] Account: {EMAIL}")

              except Exception as e:
                  print(f"[ERROR] Auto-login failed: {e}")
                  print("[INFO] You can manually login via RDP at the 9Router dashboard.")
                  sys.exit(0)  # Don't fail the workflow

              finally:
                  page.quit()

          if __name__ == "__main__":
              main()
          "@

          Set-Content -Path "$env:TEMP\antigravity-bot\totp_login.py" -Value $totpScript -Encoding UTF8

          # First try the TOTP-aware script
          Push-Location "$env:TEMP\antigravity-bot"
          try {
            python totp_login.py 2>&1
            Write-Host "Antigravity account connected with 2FA via GitHub Secrets."
          } catch {
            Write-Warning "TOTP login attempt: $($_.Exception.Message)"
            # Fallback: try the original bot
            try {
              python main.py --headless --fast 2>&1
              Write-Host "Antigravity connected via original bot."
            } catch {
              Write-Warning "All auto-login attempts completed. Manual login via RDP may be needed."
            }
          }
          Pop-Location
          "ANTIGRAVITY_CONNECTED=1" | Out-File -Append $env:GITHUB_ENV

      - name: Install DeepSeek Harness (dsh) globally
        run: |
          npm install -g @deepseek-ai/dsh
          dsh --version
          Write-Host "DeepSeek Harness installed successfully."

      - name: Start DeepSeek Harness Web UI (background)
        run: |
          # Start dsh web in background on port 3080
          $job = Start-Job -ScriptBlock {
            dsh web --no-open 2>&1
          }
          # Wait for DSH to be ready
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:3080" -UseBasicParsing -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if ($ready) {
            Write-Host "DeepSeek Harness Web UI running at http://localhost:3080"
          } else {
            Write-Warning "DSH Web UI may not be fully ready yet, continuing..."
          }
          "DSH_RUNNING=1" | Out-File -Append $env:GITHUB_ENV

      - name: Configure DeepSeek Harness to use 9Router
        run: |
          # Point DeepSeek Harness to 9Router's OpenAI-compatible endpoint
          # 9Router with Antigravity provides free Claude/GPT/Gemini access
          $env:DEEPSEEK_BASE_URL = "http://localhost:20128/v1"
          "DEEPSEEK_BASE_URL=http://localhost:20128/v1" | Out-File -Append $env:GITHUB_ENV
          Write-Host "DeepSeek Harness configured to route through 9Router."
          Write-Host "  9Router dashboard : http://localhost:20128"
          Write-Host "  DSH Web UI        : http://localhost:3080"
          Write-Host "  Antigravity       : connected via GitHub Secrets"

      - name: Open 9Router + DSH firewall ports
        run: |
          # 9Router port
          netsh advfirewall firewall delete rule name="9Router-TCP-20128" 2>$null
          netsh advfirewall firewall add rule name="9Router-TCP-20128" dir=in action=allow protocol=TCP localport=20128
          # DeepSeek Harness port
          netsh advfirewall firewall delete rule name="DSH-TCP-3080" 2>$null
          netsh advfirewall firewall add rule name="DSH-TCP-3080" dir=in action=allow protocol=TCP localport=3080
          Write-Host "Firewall ports opened: 20128 (9Router), 3080 (DSH)"

      # ============================================================

      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $installerPath = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath
              Start-Process msiexec.exe -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" -Wait
              Remove-Item $installerPath -Force
            } catch {
              Write-Host "MSI install failed, trying winget…"
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            }
          }
          if (-not (Test-Path $rdExe)) { Write-Error "RustDesk not found after install"; exit 1 }
          Write-Host "RustDesk installed."

      - name: Open RustDesk ports (TCP 21115-21119, UDP 21116)
        run: |
          for ($p=21115; $p -le 21119; $p++) {
            $name = "APP-PORT-TCP-$p"
            netsh advfirewall firewall delete rule name=$name 2>$null
            netsh advfirewall firewall add rule name=$name dir=in action=allow protocol=TCP localport=$p
          }
          $udpName = "APP-PORT-UDP-21116"
          netsh advfirewall firewall delete rule name=$udpName 2>$null
          netsh advfirewall firewall add rule name=$udpName dir=in action=allow protocol=UDP localport=21116

      - name: Launch RustDesk (foreground) + Screenshot to Gofile
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Start-Process -FilePath $rdExe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $screenshotPath = "$env:TEMP\rustdesk_${{ matrix.id }}.png"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()

          $curlResult = curl -F "file=@$screenshotPath" https://store1.gofile.io/uploadFile
          $json = $curlResult | ConvertFrom-Json
          if ($json.status -eq "ok") { "SCREENSHOT_URL=$($json.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV }

      - name: Keep alive (to ${{ env.RUNTIME_MINUTES }} mins)
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $reqEnd = (Get-Date).AddMinutes($mins)

          # GitHub hard-kills jobs at 360 min. Stop at job-start + 358m so the
          # 'Dispatch next or stop' step still runs gracefully afterwards.
          $hardEnd = $null
          if ("$env:JOB_START_EPOCH" -match '^\d+$') {
            $hardEnd = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START_EPOCH).LocalDateTime.AddMinutes(358)
          }
          $end = $reqEnd
          if ($hardEnd -and $reqEnd -gt $hardEnd) {
            $end = $hardEnd
            Write-Host "Runtime capped by GitHub 6h job limit: keep-alive ends at $($end.ToString('HH:mm:ss'))"
          }

          while ((Get-Date) -lt $end) {
            $mode = if ("$env:CRD_ENABLED" -eq '1') { '[CRD+RustDesk/RDP]' } else { '[RustDesk/RDP]' }
            $extra = ""
            if ("$env:NINEROUTER_RUNNING" -eq '1') { $extra += " | 9Router:20128" }
            if ("$env:DSH_RUNNING" -eq '1') { $extra += " | DSH:3080" }
            if ("$env:ANTIGRAVITY_CONNECTED" -eq '1') { $extra += " | AG:connected" }
            Write-Host ("$mode Heartbeat " + (Get-Date).ToString("HH:mm:ss") + " ends at " + $end.ToString("HH:mm:ss") + " | RS URL: $env:SCREENSHOT_URL" + $extra)
            Start-Sleep -Seconds 60
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" }
              $body = @{ ref="${{ github.ref_name }}"; inputs=$payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
              Write-Host "Dispatched STOP."
            } else {
              $payload = @{
                ts_tailnet      = "${{ inputs.ts_tailnet }}"
                ts_api_key      = "${{ inputs.ts_api_key }}"
                ts_authkey      = "${{ inputs.ts_authkey }}"
                quick_test      = "${{ inputs.quick_test }}"
                runtime_minutes = "${{ inputs.runtime_minutes }}"
                do_purge        = "${{ inputs.do_purge }}"
                cycles          = "$next"
                rdp_count       = "${{ inputs.rdp_count }}"
                crd_code        = "${{ inputs.crd_code }}"
                crd_pin         = "${{ inputs.crd_pin }}"
              }
              $url2 = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-rustdesk-B.yml/dispatches"
              $hdr2 = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body2 = @{ ref="${{ github.ref_name }}"; inputs=$payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url2 -Headers $hdr2 -Body $body2 | Out-Null
              Write-Host "Dispatched Workflow B with cycles=$next"
            }
          } else { Write-Host "No cycles configured. Done." }
